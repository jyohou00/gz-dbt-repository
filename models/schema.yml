#schema.yml
version: 2
sources:
  - name: gz_raw_data
    freshness:
      error_after:
        count: 2
        period: day
      warn_after:
        count: 1
        period: day
    tables:
      - name: raw_gz_sales
        description: sales of Greenweez / we have one row per product_id found in each orders_id
        
        loaded_at_field: date_date
        freshness:
          warn_after: {count: 90, period: day}
        
        
        columns:
           - name: date_date
             description: date of purchase
           - name: orders_id
             description: foreign key to ship
           - name: pdt_id
             description: foreign key to product
           - name: revenue
             description: the amount paid by the customer to purchase the product. revenue = quantity * selling_price
           - name: quantity
             description: the quantity of products purchased for a given order
        tests:
           - unique:
               column_name: "(orders_id || '-' || pdt_id)"

      - name: raw_gz_product
        description: products of Greenweez
        columns:
           - name: products_id
             description: Primary key
             tests:
              - unique
              - not_null
           - name: purchase_price
             description: the purchase price of the product

      - name: raw_gz_ship
        description: shipping data for Greenweez orders
        columns:
          - name: orders_id
            description: Primary key
            tests:
              - unique
              - not_null
          - name: shipping_fee
            description: the price the customer pays for shipping
          - name: log_cost
            description: the cost of preparing the parcel in the distribution centre/warehouse
          - name: ship_cost
            description: shipping cost paid by Greenweez to the carrier/logistics provider

models:
   - name: int_sales_margin
     description: margin calculation per order
     columns:
       - name: orders_id
         description: orders key
         tests:
           - not_null
       - name: products_id
         description: products key
         tests:
           - not_null
       - name: margin
         description: Margin = Revenue - Purchase_cost
         tests:
           - not_null
       - name: Purchase_cost
         description: Purchase_cost = Quantity * Purchase_price
         tests:
           - not_null
       - name: date_date
         description: date of the order
         tests:
           - not_null
       - name: revenue
         description: sum of revenue per order
         tests:
           - not_null
       - name: quantity
         description: sum of quantity per order
         tests:
           - not_null
     tests:
       - unique:
           column_name: "(orders_id || '-' || products_id)"


   - name: int_orders_margin
     description: margin calculation per order
     columns:
       - name: orders_id
         description: orders key
         tests:
           - not_null
           - unique
       - name: date_date
         description: date of the order
         tests:
           - not_null

       - name: revenue
         description: sum of revenue per order
         tests:
           - not_null
       - name: quantity
         description: sum of quantity per order
         tests:
           - not_null

       - name: Purchase_cost
         description: Purchase_cost = Quantity * Purchase_price
         tests:
           - not_null

       - name: margin
         description: Margin = Revenue - Purchase_cost
         tests:
           - not_null

   - name: int_orders_operational
     description: margin calculation per order
     columns:
       - name: orders_id
         description: orders key
         tests:
           - not_null
           - unique

       - name: date_date
         description: date of the order
         tests:
           - not_null

       - name: operational_margin
         description: operational_margin = margin + Shipping_fee – log_cost - ship_cost)
         tests:
           - not_null

       - name: quantity
         description: sum of quantity per order
         tests:
           - not_null

       - name: revenue
         description: sum of revenue per order
         tests:
           - not_null
       
       - name: Purchase_cost
         description: Purchase_cost = Quantity * Purchase_price
         tests:
           - not_null

       - name: margin
         description: Margin = Revenue - Purchase_cost
         tests:
           - not_null
